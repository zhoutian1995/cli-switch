  # === Codex CLI 原生模型 ===
  gpt-5.2-codex:
    name: "GPT-5.2 Codex"
    tool: codex
    model_id: "gpt-5.2-codex"
    description: "深度搜索"
    base_url: "https://api.aiclaude.xyz/v1"
    api_key_env: "OPENAI_API_KEY"
    tags: [openai]
    supported_tools: [codex]

  # === MCP Servers (Model Context Protocol) - GLM Coding Plan 专属 ===
  # 环境变量: ZHIPU_AUTH_TOKEN = 智谱 API Key
  # 额度说明:
  #   Lite: 联网搜索/网页读取/开源仓库 MCP 每月合计 100 次
  #   Pro:  联网搜索/网页读取/开源仓库 MCP 每月合计 1000 次
  #   Max:  联网搜索/网页读取/开源仓库 MCP 每月合计 4000 次
  #   视觉理解 MCP: 所有套餐共享 5 小时最大 prompt 资源池

  # 视觉理解 MCP - 图像分析、视频理解、UI 截图转代码、OCR 等
  zai-mcp-server:
    name: "智谱视觉理解 MCP"
    description: "GLM-4.6V 视觉能力：图像分析、视频理解、UI 截图转代码、OCR 文字提取、错误截图诊断、技术图表理解、数据可视化分析、UI 差异对比"
    mcp_type: "server"
    enabled: false
    server_config:
      type: "stdio"
      command: "npx"
      args: ["-y", "@z_ai/mcp-server@latest"]
      env:
        Z_AI_API_KEY: "your_api_key"
        Z_AI_MODE: "ZHIPU"
    supported_tools: [claude, codex, cursor, cline, opencode]

  # 联网搜索 MCP - 网络搜索、实时信息获取
  web-search:
    name: "联网搜索 MCP"
    description: "网络搜索、实时信息获取（新闻、股价、天气等）"
    mcp_type: "remote"
    enabled: false
    server_config:
      type: "http"
      url: "https://open.bigmodel.cn/api/mcp/web_search_prime/mcp"
      headers:
        Authorization: "Bearer your_api_key"
    supported_tools: [claude, codex, cursor, cline, opencode]

  # 网页读取 MCP - 网页内容抓取、结构化数据提取
  web-reader:
    name: "网页读取 MCP"
    description: "网页内容抓取、结构化数据提取（标题、正文、元数据、链接列表）"
    mcp_type: "remote"
    enabled: false
    server_config:
      type: "http"
      url: "https://open.bigmodel.cn/api/mcp/web_reader/mcp"
      headers:
        Authorization: "Bearer your_api_key"
    supported_tools: [claude, codex, cursor, cline, opencode]

  # 开源仓库 MCP - GitHub 仓库搜索、目录结构、代码读取
  zread:
    name: "开源仓库 MCP"
    description: "GitHub 仓库知识文档与代码访问（基于 zread.ai）：仓库搜索、目录结构、代码读取"
    mcp_type: "remote"
    enabled: false
    server_config:
      type: "http"
      url: "https://open.bigmodel.cn/api/mcp/zread/mcp"
      headers:
        Authorization: "Bearer your_api_key"
    supported_tools: [claude, codex, cursor, cline, opencode]
