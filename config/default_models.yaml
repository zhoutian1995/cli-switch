# 默认模型配置
# 此文件会被复制到默认配置位置

active_tool: claude
active_model: qwen

test:
  connect_timeout: 5
  response_timeout: 30

log:
  level: INFO
  path: ~/.local/share/cli-switch/logs

models:
  # === 百炼模型 (Claude Code / Codex CLI) ===
  qwen:
    key: qwen
    name: "Qwen3.5+"
    tool: claude
    model_id: "qwen3.5-plus"
    base_url: "https://coding.dashscope.aliyuncs.com/apps/anthropic"
    api_key_env: "BAILIAN_API_KEY"
    description: "通义千问 3.5 增强版"
    tags: [bailian, recommended]

  kimi:
    key: kimi
    name: "Kimi K2.5"
    tool: claude
    model_id: "kimi-k2.5"
    base_url: "https://coding.dashscope.aliyuncs.com/apps/anthropic"
    api_key_env: "BAILIAN_API_KEY"
    description: "月之暗面 Kimi K2.5"
    tags: [bailian, recommended]

  glm:
    key: glm
    name: "GLM-5 (百炼)"
    tool: claude
    model_id: "glm-5"
    base_url: "https://coding.dashscope.aliyuncs.com/apps/anthropic"
    api_key_env: "BAILIAN_API_KEY"
    description: "智谱 GLM-5 代码专用"
    tags: [bailian, code, recommended]

  minimax:
