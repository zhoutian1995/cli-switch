[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-switch"
version = "1.1.0"
description = "AI CLI 工具切换器 - 支持 Claude Code, Gemini CLI, Codex CLI"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OpenClaw Team", email = "willezhou2015@gmail.com"}]
keywords = ["cli", "ai", "claude", "gemini", "codex", "switcher", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
cli-switch = "cli_switch.main:main"

[project.urls]
Homepage = "https://github.com/anomalyco/cli-switch"
Repository = "https://github.com/anomalyco/cli-switch.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cli_switch = ["*.yaml", "*.yml", "*.sh"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.black]
line-length = 100
target-version = ["py38"]
