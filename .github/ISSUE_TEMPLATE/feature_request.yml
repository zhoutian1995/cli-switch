name: Feature Request
description: Suggest a feature for cli-switch
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "run command"
        - "router"
        - "dispatcher"
        - "intent parser"
        - "adapters"
        - "other"
